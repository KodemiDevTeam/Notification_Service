spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USER:dummy@gmail.com}
    password: ${EMAIL_PASS:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  application:
    name: notification-service
  task:
    scheduling:
      pool:
        size: 5

aws:
  region: us-east-1
  accessKeyId: 5ceh4k
  secretKey: 35ffjb
  dynamodb:
    endpoint: http://localhost:8000

dynamodb:
  table:
    name: notifications

logging:
  level:
    root: INFO
    service: DEBUG
    repository: DEBUG

jwt:
  secret: ${JWT_SECRET:k8Jd9wQ2x+4aB3d1FJtL8vZ5X0yQ1V7n2gHqM4sP1tE=}

